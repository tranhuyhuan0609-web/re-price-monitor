
services:
  kafka:
    image: apache/kafka:3.9.0
    restart: unless-stopped
    hostname: kafka
    ports:
      - "${KAFKA_HOST_PORT:-9092}:9092"
    environment:
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:${KAFKA_HOST_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
   
  kafka-setup:
    image: apache/kafka:3.9.0
    container_name: kafka-setup
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: [ "sh", "-c" ]
    command: |
       '
       echo "Đang khởi tạo các topic với số lượng partition tùy chỉnh..."
       /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server kafka:19092 --topic realestate.prod.raw.v1 --partitions 4 --replication-factor 1
       /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server kafka:19092 --topic realestate.prod.dlq.v1 --partitions 2 --replication-factor 1
       echo "Khởi tạo các bài toán phân vùng topic Kafka thành công!"
       '

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    restart: unless-stopped
    ports:
      - "${KAFKA_UI_HOST_PORT:-8080}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    depends_on:
      kafka:
        condition: service_healthy

  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "${MONGO_HOST_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:?MONGO_USER is required}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?MONGO_PASSWORD is required}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --username \"$${MONGO_INITDB_ROOT_USERNAME}\" --password \"$${MONGO_INITDB_ROOT_PASSWORD}\" --authenticationDatabase admin --eval 'db.adminCommand({ ping: 1 }).ok' | grep -q 1"
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  postgres:
    image: postgres:16
    restart: unless-stopped
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-realestate}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./migration/postgres/create_silver_schema_v1.sql:/docker-entrypoint-initdb.d/01-silver-schema.sql:ro
      - ./migration/postgres/create_crawl_runs.sql:/docker-entrypoint-initdb.d/02-crawl-runs.sql:ro
      - ./migration/postgres/create_crawler_config.sql:/docker-entrypoint-initdb.d/03-crawler-config.sql:ro
      - ./migration/postgres/create_exchange_rates.sql:/docker-entrypoint-initdb.d/20-exchange-rates.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  exchange-rate-updater:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ENV: ${ENV:-dev}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-realestate}
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      MONGO_USER: ${MONGO_USER:?MONGO_USER is required}
      MONGO_PASSWORD: ${MONGO_PASSWORD:?MONGO_PASSWORD is required}
      MONGO_DB: ${MONGO_DB:-realestate_raw}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      KAFKA_RAW_TOPIC: ${KAFKA_RAW_TOPIC:-realestate.raw.v1}
      KAFKA_DLQ_TOPIC: ${KAFKA_DLQ_TOPIC:-realestate.dlq.v1}
      KAFKA_GROUP_RAW_WRITER: ${KAFKA_GROUP_RAW_WRITER:-raw-writer}
      KAFKA_GROUP_CLEAN_PROCESSOR: ${KAFKA_GROUP_CLEAN_PROCESSOR:-clean-processor}
      FX_RATE_URL: ${FX_RATE_URL:-}
      FX_RATE_SOURCE: ${FX_RATE_SOURCE:-}
      FX_RATE_FORMAT: ${FX_RATE_FORMAT:-json}
      FX_RATE_TIMEOUT_SECONDS: ${FX_RATE_TIMEOUT_SECONDS:-10}
      FX_RATE_UPDATE_INTERVAL_SECONDS: ${FX_RATE_UPDATE_INTERVAL_SECONDS:-3600}
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy

  raw-event-writer:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - python
      - -m
      - src.infrastructure.messaging.raw_event_consumer
    restart: unless-stopped
    environment:
      ENV: ${ENV:-dev}
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      MONGO_USER: ${MONGO_USER:?MONGO_USER is required}
      MONGO_PASSWORD: ${MONGO_PASSWORD:?MONGO_PASSWORD is required}
      MONGO_DB: ${MONGO_DB:-realestate_raw}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-realestate}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      KAFKA_RAW_TOPIC: ${KAFKA_RAW_TOPIC:-realestate.raw.v1}
      KAFKA_DLQ_TOPIC: ${KAFKA_DLQ_TOPIC:-realestate.dlq.v1}
      KAFKA_GROUP_RAW_WRITER: ${KAFKA_GROUP_RAW_WRITER:-raw-writer}
      KAFKA_GROUP_CLEAN_PROCESSOR: ${KAFKA_GROUP_CLEAN_PROCESSOR:-clean-processor}
    depends_on:
      kafka:
        condition: service_healthy
      mongo:
        condition: service_healthy
  
  dlq-event-writer:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - python
      - -m
      - src.infrastructure.messaging.dlq_event_consumer
    restart: unless-stopped
    environment:
      ENV: ${ENV:-dev}
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      MONGO_USER: ${MONGO_USER:?MONGO_USER is required}
      MONGO_PASSWORD: ${MONGO_PASSWORD:?MONGO_PASSWORD is required}
      MONGO_DB: ${MONGO_DB:-realestate_raw}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-realestate}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      KAFKA_RAW_TOPIC: ${KAFKA_RAW_TOPIC:-realestate.raw.v1}
      KAFKA_DLQ_TOPIC: ${KAFKA_DLQ_TOPIC:-realestate.dlq.v1}
      KAFKA_GROUP_RAW_WRITER: ${KAFKA_GROUP_RAW_WRITER:-raw-writer}
      KAFKA_GROUP_CLEAN_PROCESSOR: ${KAFKA_GROUP_CLEAN_PROCESSOR:-clean-processor}
      KAFKA_GROUP_DLQ_WRITER: ${KAFKA_GROUP_DLQ_WRITER:-dlq-mongo-writer}
    depends_on:
      kafka:
        condition: service_healthy
      mongo:
        condition: service_healthy


  clean-event-processor:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - python
      - -m
      - src.infrastructure.messaging.clean_event_consumer
    restart: unless-stopped
    environment:
      ENV: ${ENV:-dev}
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      MONGO_USER: ${MONGO_USER:?MONGO_USER is required}
      MONGO_PASSWORD: ${MONGO_PASSWORD:?MONGO_PASSWORD is required}
      MONGO_DB: ${MONGO_DB:-realestate_raw}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-realestate}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      KAFKA_RAW_TOPIC: ${KAFKA_RAW_TOPIC:-realestate.raw.v1}
      KAFKA_DLQ_TOPIC: ${KAFKA_DLQ_TOPIC:-realestate.dlq.v1}
      KAFKA_GROUP_RAW_WRITER: ${KAFKA_GROUP_RAW_WRITER:-raw-writer}
      KAFKA_GROUP_CLEAN_PROCESSOR: ${KAFKA_GROUP_CLEAN_PROCESSOR:-clean-processor}
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy

  crawler-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - python
      - -m
      - src.infrastructure.crawler.crawler_scheduler_entrypoint
    restart: unless-stopped
    environment:
      ENV: ${ENV:-dev}
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      MONGO_USER: ${MONGO_USER:?MONGO_USER is required}
      MONGO_PASSWORD: ${MONGO_PASSWORD:?MONGO_PASSWORD is required}
      MONGO_DB: ${MONGO_DB:-realestate_raw}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-realestate}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      KAFKA_RAW_TOPIC: ${KAFKA_RAW_TOPIC:-realestate.raw.v1}
      KAFKA_DLQ_TOPIC: ${KAFKA_DLQ_TOPIC:-realestate.dlq.v1}
      KAFKA_GROUP_RAW_WRITER: ${KAFKA_GROUP_RAW_WRITER:-raw-writer}
      KAFKA_GROUP_CLEAN_PROCESSOR: ${KAFKA_GROUP_CLEAN_PROCESSOR:-clean-processor}
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy

volumes:
  kafka_data:
  mongo_data:
  pg_data:
